<script>
/* mainsub: MathJax 4 (New Computer Modern, the PDF's maths font). Scaled to sit
   with the system sans text; speech/braille enrichment off so no extra data is
   fetched (assistive MathML stays on for screen readers). */
window.MathJax = {
  output: { scale: 0.92, displayOverflow: "scroll" },
  options: {
    enableEnrichment: false, enableSpeech: false, enableBraille: false, enableExplorer: false,
    menuOptions: { settings: { enrich: false, speech: false, braille: false, assistiveMml: true } }
  }
};
</script>
